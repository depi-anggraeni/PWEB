<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<table border="1" width="400" height="400" cellpadding="0" cellspacing="0">

<tr>
    <td colspan="4" style="background-color: #0000ff; text-align: center;">A</td>
    <td rowspan="4" style="background-color: #ffff00; text-align: center;">D</td>
</tr>

<tr>
    <td rowspan="4" style="background-color: #ffff00; text-align: center;">G</td>
    <td colspan="2" style="background-color: #ff0000; text-align: center;">B</td>
    <td rowspan="2" style="background-color: #01ff00; text-align: center;">C</td>
</tr>

<tr>
    <td rowspan="2" style="background-color: #01ff00; text-align: center;">F</td>
    <td style="background-color: #000000; text-align: center;"><font color="white">X</font></td>
</tr>

<tr>
    <td colspan="2" style="background-color: #ff0000; text-align: center;">E</td>
</tr>

<tr>
    <td colspan="5" style="background-color: #0000ff; text-align: center;">H</td>
</tr>

</table>

</body>
</html>
